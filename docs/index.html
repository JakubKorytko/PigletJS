<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PigletJS docs</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta
      name="description"
      content="Tiny reactive JavaScript framework. No npm. No build step. Real components."
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0"
    />
    <meta property="og:title" content="PigletJS" />
    <meta
      property="og:description"
      content="Tiny reactive JavaScript framework. No npm. No build step."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://jakubkorytko.github.io/PigletJS"
    />
    <meta name="theme-color" content="#0c0907" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css"
    />
    <link rel="stylesheet" href="theme.css" />
    <link href="favicon.svg" rel="shortcut icon" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("piglet-docs-theme");
          var theme =
            saved ||
            (window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>

  <body>
    <div id="app">
      <div class="pig-boot">
        <img src="favicon.svg" alt="" width="72" height="72" />
        <p>Loading PigletJS…</p>
      </div>
    </div>
    <script>
      /** @author Jakub Korytko */
      window.$docsify = {
        name: "PigletJS",
        nameLink: "#/",
        repo: "https://github.com/JakubKorytko/PigletJS",
        logo: "favicon.svg",
        themeColor: "#ff6a1a",
        coverpage: true,
        onlyCover: true,
        loadSidebar: true,
        auto2top: true,
        externalLinkTarget: "_blank",
        externalLinkRel: "noopener",
        maxLevel: 3,
        subMaxLevel: 0,
        alias: {
          "/.*/_sidebar.md": "/_sidebar.md",
        },
        search: {
          placeholder: "Search docs  (/)",
          noData: "No matching pages.",
          depth: 3,
          hideOtherSidebarContent: true,
        },
        pagination: {
          previousText: "Previous",
          nextText: "Next",
          crossChapter: true,
          crossChapterText: true,
        },
        copyCode: {
          buttonText: "Copy",
          errorText: "Failed",
          successText: "Copied",
        },
        formatUpdated: "Updated: {MM}/{DD}/{YYYY} {HH}:{mm}",
      };
    </script>
    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  </body>
</html>
